name: Numerical and data validation
# Runs on pushes to main and on pull requests only. Provenance branches (historical snapshots kept for the record,
# such as guard-sensitivity-2026-09-17) and tag pushes are not built; see docs/NOTEBOOK.md, 2026-09-19.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff check .
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m options_engine demo --output results/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-report-py${{ matrix.python-version }}
          path: results/ci-demo/REPORT.md
