name: checks
# Runs on pushes to main and on pull requests only. Provenance branches (historical snapshots kept for the record,
# such as guard-sensitivity-2026-09-17) and tag pushes are not built; see docs/NOTEBOOK.md, 2026-09-19.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - run: python docs/results/build_manifest.py --check
