name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - run: python docs/results/build_manifest.py --check
